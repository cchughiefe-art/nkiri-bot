name: Publish TheNkiri Compatibility Packs

on:
  workflow_dispatch:
  push:
    branches:
      - app-v1
    paths:
      - "android-native/compat-pack/**"
      - ".github/workflows/publish-compatibility-packs.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require release signing
        shell: bash
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install             "platforms;android-36"             "build-tools;36.0.0"             "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nkiri-release.jks"

      - name: Build signed compatibility packs
        working-directory: android-native
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nkiri-release.jks
        run: |
          set -e
          gradle :compat-pack:assembleRelease --stacktrace

      - name: Prepare exact download filenames
        shell: bash
        run: |
          set -e
          mkdir -p dist

          ARM64="$(find android-native/compat-pack/build/outputs/apk/release -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          ARM32="$(find android-native/compat-pack/build/outputs/apk/release -type f -name '*armeabi-v7a*release*.apk' | head -n 1)"

          test -n "$ARM64"
          test -n "$ARM32"

          cp "$ARM64" dist/TheNkiri-Compatibility-arm64-v8a.apk
          cp "$ARM32" dist/TheNkiri-Compatibility-armeabi-v7a.apk

          ls -lh dist/

      - name: Create or update compatibility release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if gh release view compat-v1 >/dev/null 2>&1; then
            echo "Compatibility release already exists."
          else
            gh release create compat-v1               --title "TheNkiri Compatibility Pack v1"               --notes "Optional VLC-based playback support for files that the lightweight Media3 player cannot decode."
          fi

          gh release upload compat-v1             dist/TheNkiri-Compatibility-arm64-v8a.apk             dist/TheNkiri-Compatibility-armeabi-v7a.apk             --clobber
