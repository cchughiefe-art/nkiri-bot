name: Publish TheNkiri Internal Playback Engine

on:
  workflow_dispatch:
  push:
    branches:
      - app-v1
    paths:
      - "android-native/compatfeature/**"
      - "android-native/app/build.gradle.kts"
      - "android-native/build.gradle.kts"
      - "android-native/settings.gradle.kts"
      - ".github/workflows/publish-internal-playback-engine.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require release signing
        shell: bash
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_BASE64"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nkiri-release.jks"

      - name: Build signed app bundle
        working-directory: android-native
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nkiri-release.jks
        run: |
          set -e
          gradle :app:bundleRelease --stacktrace

      - name: Download bundletool
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar" \
            -o "$RUNNER_TEMP/bundletool.jar"

      - name: Generate signed split APKs
        shell: bash
        run: |
          set -e

          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle=android-native/app/build/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/nkiri-release.apks" \
            --ks="$RUNNER_TEMP/nkiri-release.jks" \
            --ks-pass="pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass="pass:$ANDROID_KEY_PASSWORD" \
            --overwrite

          mkdir -p "$RUNNER_TEMP/nkiri-apks"

          unzip -q \
            "$RUNNER_TEMP/nkiri-release.apks" \
            -d "$RUNNER_TEMP/nkiri-apks"

          find \
            "$RUNNER_TEMP/nkiri-apks" \
            -type f \
            -name '*.apk' \
            -print

      - name: Prepare engine assets
        shell: bash
        run: |
          set -e

          mkdir -p dist

          MASTER="$(find "$RUNNER_TEMP/nkiri-apks" -type f -name '*compatfeature*master*.apk' | head -n 1)"
          ARM64="$(find "$RUNNER_TEMP/nkiri-apks" -type f \( -name '*compatfeature*arm64*v8a*.apk' -o -name '*compatfeature*arm64_v8a*.apk' \) | head -n 1)"
          ARM32="$(find "$RUNNER_TEMP/nkiri-apks" -type f \( -name '*compatfeature*armeabi*v7a*.apk' -o -name '*compatfeature*armeabi_v7a*.apk' \) | head -n 1)"

          test -n "$MASTER"
          test -n "$ARM64"
          test -n "$ARM32"

          cp "$MASTER" \
            dist/TheNkiri-compatfeature-master.apk

          cp "$ARM64" \
            dist/TheNkiri-compatfeature-arm64-v8a.apk

          cp "$ARM32" \
            dist/TheNkiri-compatfeature-armeabi-v7a.apk

          ls -lh dist/

      - name: Determine release tag
        shell: bash
        run: |
          set -e

          VERSION_CODE="$(grep -m1 'versionCode = ' android-native/app/build.gradle.kts | sed -E 's/[^0-9]//g')"
          test -n "$VERSION_CODE"
          echo "COMPAT_TAG=compat-$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Publish engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if ! gh release view "$COMPAT_TAG" >/dev/null 2>&1; then
            gh release create "$COMPAT_TAG" \
              --title "TheNkiri Internal Playback Engine $COMPAT_TAG" \
              --notes "Optional same-package playback engine for files Media3 cannot decode."
          fi

          gh release upload "$COMPAT_TAG" \
            dist/TheNkiri-compatfeature-master.apk \
            dist/TheNkiri-compatfeature-arm64-v8a.apk \
            dist/TheNkiri-compatfeature-armeabi-v7a.apk \
            --clobber
